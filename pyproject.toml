[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LizardByte"
version = "0.0.0"
description = "LizardByte org level documentation"
requires-python = ">=3.14"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "LizardByte", email = "lizardbyte@users.noreply.github.com"}
]

dependencies = [
    "furo==2025.12.19",
    "myst-parser==5.1.0",
    "rstcheck[sphinx]==6.3.0",
    "rstfmt==0.0.14",
    "Sphinx==9.1.0",
    "sphinx-copybutton==0.5.2",
]

[dependency-groups]
common-lint = [
    {include-group = "lint-c"},
    "flake8==7.3.0",
    "flake8-github-annotations==1.1.2",
    "nb-clean==4.0.1",
    "nbqa[toolchain]==1.9.1",
    "yamllint==1.38.0",
]
lint-c = [
    "clang-format==23.1.0",
    "cmakelang==0.6.13",
]

[tool.uv]
package = false

[project.urls]
Homepage = "https://github.com/LizardByte"
Repository = "https://github.com/LizardByte/.github"
Issues = "https://github.com/LizardByte/.github/issues"
