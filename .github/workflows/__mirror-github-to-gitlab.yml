---
# Mirror registered GitHub organizations into the matching GitLab namespace.

name: Mirror GitHub to GitLab
permissions: {}

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-github-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror GitHub to GitLab
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # Process repositories in one job so project creation, privacy checks, and mirroring stay together.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'

      - name: Get repositories
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const {readOrganizations, discoverRepositories} = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/organization-repositories.mjs`
            );
            const {mirrorRepositories} = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/gitlab-mirror.mjs`
            );
            const ignored = JSON.parse(fs.readFileSync('.github/repositories-to-ignore.json', 'utf8'));
            const repos = await discoverRepositories(github, readOrganizations(), {
              includeArchived: true, includeForks: true, includePrivate: true,
            });
            const targets = mirrorRepositories(repos, ignored, 'lizardbyte', context.repo.owner);
            fs.writeFileSync('repositories.json', JSON.stringify(targets), {mode: 0o600});
            core.info(`Prepared ${targets.length} repositories for mirroring.`);

      - name: Mirror repositories
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          GITLAB_API_URL: https://gitlab.com/api/v4
          GITLAB_GROUP: lizardbyte
          GITLAB_SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: bash .github/scripts/mirror-gitlab.sh
