---
# This workflow runs only in the source .github repository.
name: Global replicator
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC.
  workflow_dispatch:
    inputs:
      organization:
        description: 'Optional organization from organizations.json; leave empty to sync all organizations.'
        required: false
        type: string
        default: ''
      repository:
        description: 'Optional exact owner/repository; leave empty to sync all configured targets.'
        required: false
        type: string
        default: ''

concurrency:
  # All delivery runs share one group, even when dispatched from different refs.
  group: global-replicator-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'delivery' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replicate:
    name: Replicate files
    if: >-
      github.repository == 'LizardByte/.github' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source policy and files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Synchronize shared files
        id: sync
        # TODO: Update this pin to the next released version of LizardByte/actions.
        uses: LizardByte/actions/actions/org_sync@6b31dc36713e84e4f32bca78269d9812ceedf8e6
        with:
          config: .github/file-sync.json
          organizations_file: organizations.json
          organization: ${{ inputs.organization }}
          repository: ${{ inputs.repository }}
          dry_run: ${{ github.event_name == 'pull_request' }}
          token: ${{ secrets.GH_BOT_TOKEN }}
