---
# This workflow runs only in the source .github repository.
name: Global replicator
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC.
  workflow_dispatch:
    inputs:
      organization:
        description: 'Optional organization from organizations.json; leave empty to sync all organizations.'
        required: false
        type: string
        default: ''
      repository:
        description: 'Optional exact owner/repository; leave empty to sync all configured targets.'
        required: false
        type: string
        default: ''

concurrency:
  # All delivery runs share one group, even when dispatched from different refs.
  group: global-replicator-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'delivery' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replicate:
    name: Synchronize organizations and files
    if: >-
      github.repository == 'LizardByte/.github' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source policy and files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Synchronize organizations and shared files
        id: sync
        # Replace this commit pin with the next released version of LizardByte/actions.
        uses: LizardByte/actions/actions/org_sync@d4c3996b16bc81b160b02c22958150d1724b6f89
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: >-
            ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD: >-
            ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          COPR_BETA_WEBHOOK_TOKEN: ${{ secrets.COPR_BETA_WEBHOOK_TOKEN }}
          COPR_CLI_CONFIG: ${{ secrets.COPR_CLI_CONFIG }}
          COPR_STABLE_WEBHOOK_TOKEN: ${{ secrets.COPR_STABLE_WEBHOOK_TOKEN }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          FANART_PROJECT_API_KEY: ${{ secrets.FANART_PROJECT_API_KEY }}
          GH_BOT_EMAIL: ${{ secrets.GH_BOT_EMAIL }}
          GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          LRCLIB_APPLICATION_ID: ${{ secrets.LRCLIB_APPLICATION_ID }}
          ORG_SYNC_CODECOV_KOKOSTREAMTV: ${{ secrets.ORG_SYNC_CODECOV_KOKOSTREAMTV }}
          ORG_SYNC_CODECOV_SUNSHINESTREAM: ${{ secrets.ORG_SYNC_CODECOV_SUNSHINESTREAM }}
          ORG_SYNC_CODECOV_THEMERR: ${{ secrets.ORG_SYNC_CODECOV_THEMERR }}
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          TMDB_API_KEY_V3: ${{ secrets.TMDB_API_KEY_V3 }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        with:
          admin_config: ${{ inputs.repository == '' && '.github/org-sync.json' || '' }}
          admin_token: ${{ secrets.ORG_SYNC_ADMIN_TOKEN || secrets.GH_PAT || secrets.GH_BOT_TOKEN }}
          config: .github/file-sync.json
          organizations_file: organizations.json
          organization: ${{ inputs.organization }}
          repository: ${{ inputs.repository }}
          properties_file: ${{ inputs.repository == '' && 'repository-properties.json' || '' }}
          dry_run: ${{ github.event_name == 'pull_request' }}
          token: ${{ secrets.GH_BOT_TOKEN }}
