---
# This workflow runs only in the source .github repository.
name: Global replicator
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      organization:
        description: 'Optional organization from organizations.json; leave empty to sync all organizations.'
        required: false
        type: string
        default: ''
      repository:
        description: 'Optional exact owner/repository; leave empty to sync all configured targets.'
        required: false
        type: string
        default: ''

concurrency:
  # All delivery runs share one group, even when dispatched from different refs.
  group: global-replicator-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'delivery' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replicate:
    name: Replicate files
    if: >-
      github.repository == 'LizardByte/.github' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    env:
      SYNC_DRY_RUN: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source policy and files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Synchronize shared files
        id: sync
        uses: LizardByte/actions/actions/org_sync@d5471304498e623f670db93062e3769a5bf14192  # org_sync PR #348
        with:
          config: .github/file-sync.json
          organizations_file: organizations.json
          organization: ${{ inputs.organization }}
          repository: ${{ inputs.repository }}
          dry_run: ${{ env.SYNC_DRY_RUN }}
          token: ${{ secrets.GH_BOT_TOKEN }}

      - name: Save synchronization report
        if: >-
          always() && !cancelled() &&
          (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure')
        env:
          SYNC_RESULTS: ${{ steps.sync.outputs.results }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SYNC_CHANGED: ${{ steps.sync.outputs.changed_repositories }}
          SYNC_FAILED: ${{ steps.sync.outputs.failed_repositories }}
          SYNC_ORGANIZATION: ${{ inputs.organization }}
          SYNC_REPOSITORY: ${{ inputs.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const script = path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/file-sync-report.mjs');
            const { writeSyncReport } = await import(pathToFileURL(script).href);
            await writeSyncReport({ core, context, env: process.env });

      - name: Upload synchronization report
        if: >-
          always() && !cancelled() &&
          (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: file-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/file-sync/results.json
          if-no-files-found: error
          retention-days: 14
