---
# This workflow is centrally managed in https://github.com/<organization>/.github/
# Don't make changes to this file in this repo as they will be overwritten with changes made to the same file in
# the above-mentioned repo.

# To use, select `winget` in the `workflow_profiles` repository custom property.

# Update Winget on release events.

name: Update Winget repo (called)
permissions: {}

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: 'GitHub token to use for the workflow.'
        required: true

jobs:
  organization:
    uses: ./.github/workflows/__call-organization.yml

  update-winget-repo:
    needs: organization
    if: needs.organization.outputs.allowed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: Winget
      url: ${{ steps.winget.outputs.pr-url }}
    steps:
      - name: Check workflow profile
        id: check-profile
        env:
          WORKFLOW_PROFILE: winget
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data: values } = await github.request('GET /repos/{owner}/{repo}/properties/values', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const profiles = values.find(property => property.property_name === 'workflow_profiles')?.value ?? [];
            if (!Array.isArray(profiles) || !profiles.every(profile => typeof profile === 'string')) {
              throw new Error('Invalid workflow_profiles custom property');
            }
            const enabled = profiles.includes(process.env.WORKFLOW_PROFILE);
            core.info(`Workflow profile ${process.env.WORKFLOW_PROFILE}: ${enabled}`);
            core.setOutput('enabled', enabled);

      - name: Download release asset
        id: download
        if: steps.check-profile.outputs.enabled == 'true'
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f  # v1.13
        with:
          repository: "${{ github.repository }}"
          tag: "${{ github.event.release.tag_name }}"
          fileName: "*.{exe,msi,msix,appx,msixbundle,appxbundle}"  # this action uses minimatch
          tarBall: false
          zipBall: false
          out-file-path: "release_downloads"
          extract: false

      - name: Sync WinGet fork
        if: >-
          steps.check-profile.outputs.enabled == 'true' &&
          fromJson(steps.download.outputs.downloaded_files)[0]
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WINGET_FORK: ${{ vars.GH_BOT_NAME }}/winget-pkgs
        run: gh repo sync "$WINGET_FORK" --branch master

      - name: Release to WinGet
        id: winget
        if: >-
          steps.check-profile.outputs.enabled == 'true' &&
          fromJson(steps.download.outputs.downloaded_files)[0]
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54  # v2
        with:
          fork-user: "${{ vars.GH_BOT_NAME }}"
          identifier: "LizardByte.${{ github.event.repository.name }}"
          release-tag: "${{ github.event.release.tag_name }}"
          token: "${{ secrets.GH_TOKEN }}"
