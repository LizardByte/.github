---
# Update the year in license files

name: Update License Years
permissions: {}

on:
  schedule:
    - cron: '0 2 1 1 *'  # run on 1st Jan every year at 2am UTC
  workflow_dispatch:

jobs:
  setup-matrix:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.result }}
      has-repositories: ${{ steps.set-matrix.outputs.has-repositories }}
    permissions:
      contents: read
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get repos
        id: set-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          script: |
            const {readOrganizations, maintenanceMatrix} = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/organization-repositories.mjs`
            );
            const matrix = await maintenanceMatrix(github, readOrganizations(), {includeForks: false});
            core.setOutput('has-repositories', matrix.include.length > 0);
            return matrix;

  update:
    if: needs.setup-matrix.outputs.has-repositories == 'true'
    name: Update License Year (${{ matrix.full_name }})
    needs: setup-matrix
    permissions: {}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      max-parallel: 5  # run only a few at a time to attempt to avoid GitHub api rate limits
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ matrix.full_name }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          fetch-depth: 0
          filter: blob:none

      - name: LICENSE exists
        id: license-exists
        shell: bash
        run: |
          license_exists=true
          if [ ! -f LICENSE ]; then
            license_exists=false
          fi
          echo "license_exists=${license_exists}" >> "${GITHUB_OUTPUT}"

      - name: Update license year
        if: steps.license-exists.outputs.license_exists == 'true'
        uses: FantasticFiasco/action-update-license-year@f180e962fa988db222d8f03ef4636750312d1b3d  # v3.0.4
        with:
          commitAuthorEmail: ${{ secrets.GH_BOT_EMAIL }}
          commitAuthorName: ${{ vars.GH_BOT_NAME }}
          commitTitle: 'docs(license): update copyright year(s) to {{currentYear}}'
          prTitle: 'docs(license): update copyright year(s) to {{currentYear}}'
          token: ${{ secrets.GH_BOT_TOKEN }}
