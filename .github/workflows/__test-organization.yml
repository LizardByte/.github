---
name: Organization authorization tests
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  organization:
    uses: ./.github/workflows/__call-organization.yml

  tests:
    needs: organization
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'

      - name: Test shared workflows and scripts
        run: node --test
