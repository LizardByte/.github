---
# Update build-deps submodules and refresh pinned prebuilt release assets.

name: Update build-deps
permissions: {}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to update.'
        required: true
        type: choice
        options:
          - Sunshine
          - Koko
          - One

jobs:
  update-build-deps:
    name: Update build-deps - ${{ inputs.repo }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          fetch-depth: 0
          filter: blob:none
          path: repo

      - name: Update build-deps submodule
        id: update-build-deps
        working-directory: repo
        run: |
          if ! git ls-files --stage third-party/build-deps | grep -q '^160000 '; then
            echo "Expected a build-deps submodule at third-party/build-deps." >&2
            exit 1
          fi

          git submodule update --init third-party/build-deps
          git -C third-party/build-deps fetch --force --tags origin

          current_commit=$(git -C third-party/build-deps rev-parse HEAD)
          latest_tag=$(git -C third-party/build-deps tag --sort=-version:refname | sed -n '1p')

          if [ -z "${latest_tag}" ]; then
            echo "No build-deps tags were found."
            exit 1
          fi

          latest_commit=$(git -C third-party/build-deps rev-list -n 1 "${latest_tag}")
          echo "version=${latest_tag}" >> "${GITHUB_OUTPUT}"

          if [ "${current_commit}" = "${latest_commit}" ]; then
            echo "build-deps is already at ${latest_tag}."
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git -C third-party/build-deps checkout --detach "${latest_tag}"
          echo "updated=true" >> "${GITHUB_OUTPUT}"

      - name: Update build-deps release assets
        id: get-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          BUILD_DEPS_VERSION: ${{ steps.update-build-deps.outputs.version }}
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const options = {owner: context.repo.owner, repo: 'build-deps'};
            const tag = process.env.BUILD_DEPS_VERSION;
            if (!tag) {
              throw new Error('No build-deps submodule release tag was selected.');
            }
            const response = await github.rest.repos.getReleaseByTag({...options, tag});
            const release = response.data;
            if (release.tag_name !== tag) {
              throw new Error(`Expected release ${tag}, received ${release.tag_name}.`);
            }
            // One currently has no Flatpak packaging; its submodule is the only dependency pin.
            const paths = ['repo/packaging/linux/flatpak/modules/ffmpeg.json']
              .filter(path => fs.existsSync(path));

            const updates = paths.map(path => {
              const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (!Array.isArray(manifest.sources) || manifest.sources.length === 0) {
                throw new Error(`Expected prebuilt sources in ${path}.`);
              }
              if (path.includes('/flatpak/')) {
                for (const arch of ['x86_64', 'aarch64']) {
                  const count = manifest.sources.filter(source =>
                    JSON.stringify(source['only-arches']) === JSON.stringify([arch])).length;
                  if (count !== 1) {
                    throw new Error(`Expected one Flatpak FFmpeg source for ${arch}, found ${count}.`);
                  }
                }
              }
              const sources = manifest.sources.map(source => {
                const name = new URL(source.url).pathname.split('/').pop();
                const assets = release.assets.filter(asset => asset.name === name);
                if (assets.length !== 1) {
                  throw new Error(`Expected one release asset named ${name}, found ${assets.length}.`);
                }
                const asset = assets[0];
                const digest = /^sha256:([0-9a-f]{64})$/i.exec(asset.digest || '');
                if (!digest || !asset.browser_download_url) {
                  throw new Error(`Release asset ${name} does not have a valid URL and SHA-256 digest.`);
                }
                return {...source, url: asset.browser_download_url, sha256: digest[1].toLowerCase()};
              });
              const changed = sources.some((source, index) =>
                source.url !== manifest.sources[index].url || source.sha256 !== manifest.sources[index].sha256);
              return {path, manifest: {...manifest, sources}, changed};
            }).filter(update => update.changed);

            // Validate every source before writing any manifest.
            for (const {path, manifest} of updates) {
              fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
            }
            core.setOutput('updated', String(updates.length > 0));
            core.setOutput('version', release.tag_name);
            core.setOutput('body', release.body || '');

      - name: Create/Update Pull Request
        id: create-pr
        if: >-
          steps.update-build-deps.outputs.updated == 'true' ||
          steps.get-release.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          author: "${{ vars.GH_BOT_NAME }} <${{ secrets.GH_BOT_EMAIL }}>"
          committer: "${{ vars.GH_BOT_NAME }} <${{ secrets.GH_BOT_EMAIL }}>"
          path: "repo"
          token: ${{ secrets.GH_BOT_TOKEN }}
          commit-message: "chore(deps): Update build-deps to ${{ steps.get-release.outputs.version }}"
          branch: bot/bump-build-deps-${{ steps.get-release.outputs.version }}
          delete-branch: true
          title: "chore(deps): Update build-deps to ${{ steps.get-release.outputs.version }}"
          body: ${{ steps.get-release.outputs.body }}
          labels: dependencies
