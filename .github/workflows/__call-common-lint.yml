---
# This workflow will lint the code in the repository using various tools. Most linting tools in LizardByte
# should be included in this workflow; however, there are cases where that is not true, such as with eslint.

name: common lint (called)
permissions: {}

on:
  pull_request:
  workflow_call:
    inputs:
      actionlint_config:
        required: false
        type: string
      check_trailing_space_ignore_pattern:
        required: false
        type: string
        default: ""
      runner:
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  lint:
    name: Common Lint
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ (inputs && inputs.runner && fromJson(inputs.runner)) || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download common lint resources
        shell: bash
        working-directory: .github
        run: |
          mkdir -p matchers

          if [ "${{ github.repository }}" = "LizardByte/.github" ]; then
            # use the version from the same ref
            ref="${{ github.ref }}"
          else
            ref="master"
          fi
          gh_base_url="https://raw.githubusercontent.com/LizardByte/.github"
          common_lint_path="${gh_base_url}/${ref}"
          gh_path="${gh_base_url}/${ref}/.github/matchers"

          mkdir -p ../.common-lint
          for file in pyproject.toml uv.lock; do
            echo "Downloading ${file} from ${common_lint_path}/${file}"
            curl \
              --proto "=https" \
              -fsSL \
              --retry 3 \
              "${common_lint_path}/${file}" \
              -o "../.common-lint/${file}"
          done

          cd matchers
          declare -A files=(
            [actionlint]="https://raw.githubusercontent.com/rhysd/actionlint/main/.github/actionlint-matcher.json"
            [clang-format]="${gh_path}/clang-format.json"
            [cmake-lint]="${gh_path}/cmake-lint.json"
            [gcc]="${gh_path}/gcc.json"
            [hadolint]="${gh_path}/hadolint.json"
            [shellcheck-gcc]="${gh_path}/shellcheck-gcc.json"
            [yamllint]="${gh_path}/yamllint.json"
          )

          for name in "${!files[@]}"; do
            if [ ! -f "${name}.json" ]; then
              url="${files[$name]}"
              echo "Downloading ${name}.json from ${url}"
              curl \
                --proto "=https" \
                -fsSL \
                --retry 3 \
                "$url" \
                -o "${name}.json"
            else
              echo "Skipping download of ${name}.json, already exists"
              continue
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          activate-environment: true
          cache-dependency-glob: uv.lock
          venv-path: ${{ runner.temp }}/common-lint-venv
          working-directory: .common-lint

      - name: Resolve C/C++ lint requirements
        shell: bash
        run: |
          lint_c_project=".common-lint"
          lint_c_source="group"
          initialized_submodule=""
          submodule="third-party/lizardbyte-common"

          find_lint_c_source() {
            python - "$1/pyproject.toml" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          try:
              config = tomllib.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, tomllib.TOMLDecodeError):
              raise SystemExit(0)

          if config.get("dependency-groups", {}).get("lint-c"):
              print("group")
          elif config.get("project", {}).get("optional-dependencies", {}).get("lint-c"):
              print("extra")
          PY
          }

          caller_source=$(find_lint_c_source ".")
          if [ -n "${caller_source}" ] && [ -f uv.lock ]; then
            lint_c_project="."
            lint_c_source="${caller_source}"
          elif git config -f .gitmodules --get-regexp path 2>/dev/null | grep -Fq " ${submodule}"; then
            if git submodule update --init --depth 1 -- "${submodule}"; then
              initialized_submodule="${submodule}"
              submodule_source=$(find_lint_c_source "${submodule}")
              if [ -n "${submodule_source}" ] && [ -f "${submodule}/uv.lock" ]; then
                lint_c_project="${submodule}"
                lint_c_source="${submodule_source}"
              else
                echo "::warning::${submodule} has no locked lint-c requirements; using the common lint versions."
              fi
            else
              echo "::warning::Unable to check out ${submodule}; using the common lint versions."
            fi
          else
            echo "No locked caller lint-c requirements found; using the common lint versions."
          fi

          echo "Using locked C/C++ lint requirements from ${lint_c_project}"
          {
            echo "LINT_C_PROJECT=${lint_c_project}"
            echo "LINT_C_SOURCE=${lint_c_source}"
            echo "LINT_C_SUBMODULE=${initialized_submodule}"
          } >> "${GITHUB_ENV}"

      - name: Install Python dependencies
        shell: bash
        run: |
          uv sync \
            --project .common-lint \
            --active \
            --frozen \
            --no-build \
            --only-group common-lint \
            --no-python-downloads

          if [ "${LINT_C_PROJECT}" != ".common-lint" ]; then
            lint_c_args=(
              sync
              --project "${LINT_C_PROJECT}"
              --active
              --frozen
              --inexact
              --no-build
              --no-install-project
              --no-python-downloads
            )
            if [ "${LINT_C_SOURCE}" = "group" ]; then
              lint_c_args+=(--only-group lint-c)
            else
              lint_c_args+=(--no-default-groups --extra lint-c)
            fi
            uv "${lint_c_args[@]}"
          fi

          if [ -n "${LINT_C_SUBMODULE}" ]; then
            git submodule deinit --force -- "${LINT_C_SUBMODULE}" || true
          fi
          rm -rf -- .common-lint

      - name: Install actionlint
        id: get_actionlint
        shell: bash
        env:
          ACTIONLINT_CONFIG: ${{ inputs.actionlint_config }}
        run: |
          # renovate: datasource=github-tags depName=rhysd/actionlint
          actionlint_version="v1.7.12"
          actionlint_ref="914e7df21a07ef503a81201c76d2b11c789d3fca"
          actionlint_installer="${RUNNER_TEMP}/download-actionlint.bash"
          curl \
            --proto "=https" \
            --tlsv1.2 \
            -fsSL \
            --retry 3 \
            -o "${actionlint_installer}" \
            "https://cdn.jsdelivr.net/gh/rhysd/actionlint@${actionlint_ref}/scripts/download-actionlint.bash"
          bash "${actionlint_installer}" "${actionlint_version#v}"

          if [ -n "${ACTIONLINT_CONFIG}" ]; then
            mkdir -p .github
            printf "%s" "${ACTIONLINT_CONFIG}" > .github/actionlint.yml
          elif [ ! -f ".github/actionlint.yml" ]; then
            url="https://raw.githubusercontent.com/LizardByte/.github/master/.github/actionlint.yml"
            echo "Downloading ${url} with curl"
            curl \
              -fsS \
              --retry 3 \
              -o ".github/actionlint.yml" \
              ${url}
          fi

      - name: Replace shell
        # for actionlint
        shell: bash
        run: |
          # Replace in workflow files
          find .github/workflows -type f -iname "*.yml" | while read -r file; do
            sed -i -e 's/msys2 {0}/bash/g' -e 's/freebsd {0}/sh/g' "${file}"
          done

          # Replace in all action.yml files anywhere
          find . -type f -iname "action.yml" | while read -r file; do
            sed -i -e 's/msys2 {0}/bash/g' -e 's/freebsd {0}/sh/g' "${file}"
          done

      - name: actionlint
        shell: bash
        if: always()
        run: |
          echo "::add-matcher::.github/matchers/actionlint.json"
          set +e
          error=0
          ${{ steps.get_actionlint.outputs.executable }} -color
          error=$?
          set -e
          echo "::remove-matcher owner=actionlint::"
          exit ${error}

      - name: check-trailing-spaces
        if: always()
        uses: LizardByte/actions/actions/trailing_spaces@aef56a192d51ec7445b29117a32b9bd25d2b103c  # v2026.829.140353
        with:
          ignore_patterns: ${{ inputs.check_trailing_space_ignore_pattern }}

      - name: C/C++ - find files
        id: cpp_files
        if: always()
        shell: bash
        run: |
          # find files
          found_files=$(find . -type f \
            -iname "*.c" -o \
            -iname "*.cpp" -o \
            -iname "*.h" -o \
            -iname "*.hpp" -o \
            -iname "*.m" -o \
            -iname "*.mm" \
          )
          ignore_files=$(find . -type f -iname ".clang-format-ignore")

          # Loop through each C/C++ file
          for file in $found_files; do
            for ignore_file in $ignore_files; do
              ignore_directory=$(dirname "$ignore_file")
              # if directory of ignore_file is beginning of file
              if [[ "$file" == "$ignore_directory"* ]]; then
                echo "ignoring file: ${file}"
                found_files="${found_files//${file}/}"
                break 1
              fi
            done
          done

          # remove empty lines
          found_files=$(echo "$found_files" | sed '/^\s*$/d')

          echo "found cpp files: ${found_files}"

          # shellcheck disable=SC2086  # do not quote to keep this as a single line
          echo found_files=${found_files} >> "${GITHUB_OUTPUT}"

      - name: C/C++ - Update Clang format config
        if: always() && steps.cpp_files.outputs.found_files
        shell: bash
        run: |
          echo "LineEnding: LF" >> .clang-format

      - name: C/C++ - Clang format (diff)
        id: clang_format_diff
        if: always() && steps.cpp_files.outputs.found_files
        shell: bash
        env:
          CPP_FILES: ${{ steps.cpp_files.outputs.found_files }}
        run: |
          set +e
          error=0
          # shellcheck disable=SC2086  # split the space-delimited file list
          for file in ${CPP_FILES}; do
            clang-format --style=file "${file}" |
              diff \
                --unified=3 \
                --label "${file} (original)" \
                --label "${file} (reformatted)" \
                "${file}" \
                -
            statuses=("${PIPESTATUS[@]}")
            if [ "${statuses[0]}" -ne 0 ]; then
              error=2
            elif [ "${statuses[1]}" -gt "${error}" ]; then
              error="${statuses[1]}"
            fi
          done
          set -e
          exit "${error}"

      - name: C/C++ - Clang format (annotations)
        if: always() && steps.clang_format_diff.outcome == 'failure'
        shell: bash
        run: |
          echo "::add-matcher::.github/matchers/clang-format.json"
          set +e
          error=0
          clang-format \
            --dry-run \
            --style=file \
            --Werror \
            ${{ steps.cpp_files.outputs.found_files }}
          error=$?
          set -e
          echo "::remove-matcher owner=clang-format::"
          exit ${error}

      - name: CMake - find files
        id: cmake_files
        if: always()
        shell: bash
        run: |
          # find files
          found_files=$(find . -type f -iname "CMakeLists.txt" -o -iname "*.cmake")
          ignore_files=$(find . -type f -iname ".cmake-lint-ignore")

          # Loop through each CMake file
          for file in $found_files; do
            for ignore_file in $ignore_files; do
              ignore_directory=$(dirname "$ignore_file")
              # if directory of ignore_file is beginning of file
              if [[ "$file" == "$ignore_directory"* ]]; then
                echo "ignoring file: ${file}"
                found_files="${found_files//${file}/}"
                break 1
              fi
            done
          done

          # remove empty lines
          found_files=$(echo "$found_files" | sed '/^\s*$/d')

          echo "found cmake files: ${found_files}"

          # shellcheck disable=SC2086  # do not quote to keep this as a single line
          echo found_files=${found_files} >> "${GITHUB_OUTPUT}"

      - name: CMake - cmake-lint
        if: always() && steps.cmake_files.outputs.found_files
        shell: bash
        run: |
          echo "::add-matcher::.github/matchers/cmake-lint.json"
          set +e
          error=0
          cmake-lint --line-width 120 --tab-size 4 ${{ steps.cmake_files.outputs.found_files }}
          error=$?
          set -e
          echo "::remove-matcher owner=cmake-lint::"
          exit ${error}

      - name: Docker - find files
        id: docker_files
        if: always()
        shell: bash
        run: |
          found_files=$(find . -type f -iname "Dockerfile" -o -iname "*.dockerfile")

          echo "found_files: ${found_files}"

          # shellcheck disable=SC2086  # do not quote to keep this as a single line
          echo found_files=${found_files} >> "${GITHUB_OUTPUT}"

      - name: Docker - hadolint
        if: always() && steps.docker_files.outputs.found_files
        shell: bash
        run: |
          docker pull hadolint/hadolint

          # create hadolint config file
          cat <<EOF > .hadolint.yaml
          ---
          failure-threshold: style
          format: tty
          ignored:
            - DL3008
            - DL3013
            - DL3016
            - DL3018
            - DL3028
            - DL3059
          no-color: true
          no-fail: false
          strict-labels: true
          EOF

          error=0

          echo "::add-matcher::.github/matchers/hadolint.json"
          set +e
          for file in ${{ steps.docker_files.outputs.found_files }}; do
            echo "file: ${file}"
            output=$(docker run --rm -i \
              -e "NO_COLOR=0" \
              -e "HADOLINT_VERBOSE=0" \
              -v "$(pwd)"/.hadolint.yaml:/.config/hadolint.yaml \
              hadolint/hadolint < "${file}" 2>&1)
            status=$?
            if [ ${status} -ne 0 ]; then
              error=1
              echo "${output}"
            fi
          done
          set -e
          echo "::remove-matcher owner=hadolint::"

          exit ${error}

      - name: PowerShell - PSScriptAnalyzer
        if: always()
        shell: pwsh
        run: |
          # PSScriptAnalyzer is already installed on GitHub runners
          if ($env:RUNNER_NAME -notlike 'GitHub Actions*') {
            $repo = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
            if (-not $repo) {
              Register-PSRepository -Default -InstallationPolicy Trusted
            } else {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            }
            Install-Module -Name PSScriptAnalyzer -Force
          }

          # To see a list of available rules, run the following command:
          # Get-ScriptAnalyzerRule | Format-List

          # Create PSScriptAnalyzer config file only if it doesn't exist
          if (-not (Test-Path ./PSScriptAnalyzerSettings.psd1)) {
              @'
          @{
              Severity=@(
                  'Error',
                  'Information',
                  'Warning'
              )
              ExcludeRules=@(
                  'PSAlignAssignmentStatement'
              )
          }
          '@ | Out-File -FilePath ./PSScriptAnalyzerSettings.psd1
          }

          # Run PSScriptAnalyzer recursively on the whole repository
          $results = Invoke-ScriptAnalyzer -Path "." -Recurse

          Write-Host "::group::Analyzing PowerShell files"

          if ($results) {
            foreach ($result in $results) {
              $file = $result.ScriptPath
              $line = $result.Line
              $title = "[$($result.Severity)] $($result.RuleName)"
              $message = $result.Message

              # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#setting-an-error-message
              Write-Output "::error file=$file,line=$line,title=$title::$message"
            }
          }
          Write-Host "::endgroup::"

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found issues in PowerShell files"
            exit 1
          }

          Write-Information "PSScriptAnalyzer found no issues in PowerShell files"

      - name: Python - flake8
        if: always()
        shell: bash
        run: |
          echo "::group::problem matcher"
          set +e
          error=0
          python -m flake8 \
            --format github \
            --verbose
          error=$?
          set -e
          echo "::endgroup::"

          # run flake8 again with human friendly output if there were errors
          if [ $error -ne 0 ]; then
            python -m flake8 \
              --color=always \
              --verbose
          fi

      - name: Python - nbqa flake8
        if: always()
        shell: bash
        run: |
          echo "::group::problem matcher"
          set +e
          error=0
          python -m nbqa flake8 \
            --format=github \
            --verbose \
            .
          error=$?
          set -e
          echo "::endgroup::"

          # run nbqa flake8 again with human friendly output if there were errors
          if [ $error -ne 0 ]; then
            python -m nbqa flake8 \
              --color=always \
              --verbose \
              .
          fi

      - name: Python - nb-clean
        if: always()
        shell: bash
        run: |
          output=$(find . -name '*.ipynb' -exec nb-clean check {} \;)

          # fail if there are any issues
          if [ -n "$output" ]; then
            echo "$output"
            exit 1
          fi

      - name: Rust - find Cargo.toml
        id: run_cargo
        if: always()
        shell: bash
        run: |
          # check if Cargo.toml exists
          if [ -f "Cargo.toml" ]; then
              echo "found_cargo=true" >> "${GITHUB_OUTPUT}"
          else
              echo "found_cargo=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Rust
        if: always() && steps.run_cargo.outputs.found_cargo == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          components: 'rustfmt'
          cache: false
          matcher: false  # disable the built-in problem matcher
          toolchain: 'nightly'

      - name: Rust - cargo fmt
        if: always() && steps.run_cargo.outputs.found_cargo == 'true'
        shell: bash
        run: |
          set +e
          error=0
          cargo +nightly fmt -- --check
          error=$?
          set -e

          if [ $error -ne 0 ]; then
            echo "::group::rustfmt github annotations"
            # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#setting-an-error-message

            # each mismatch in mismatches has the following fields:
            # - original_begin_line
            # - original_end_line
            # - expected_begin_line
            # - expected_end_line
            # - original
            # - expected
            # note: original and expected may have \n which does not render properly,
            # so we will just tell the user to run `cargo +nightly fmt`
            cargo +nightly fmt -- --emit=json | jq -r '
              .[] as $file
              | $file.mismatches[]?
              | "::error "
                + "file=\($file.name),"
                + "line=\(.original_begin_line),"
                + "endLine=\(.original_end_line),"
                + "title=rustfmt mismatch"
                + "::Run `cargo +nightly fmt` to fix formatting issues"
            '
            echo "::endgroup::"
            exit ${error}
          fi

      - name: shellcheck - find files
        id: shellcheck_files
        if: always()
        shell: bash
        run: |
          found_files=$(find . -type f -iname "*.bash" -o -iname "*.sh")

          echo "found_files: ${found_files}"

          # shellcheck disable=SC2086  # do not quote to keep this as a single line
          echo found_files=${found_files} >> "${GITHUB_OUTPUT}"

      - name: Install ShellCheck
        if: always() && steps.shellcheck_files.outputs.found_files
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi

          shellcheck_release="stable"
          case "$(uname -m)" in
            x86_64 | amd64)
              shellcheck_arch="x86_64"
              ;;
            aarch64 | arm64)
              shellcheck_arch="aarch64"
              ;;
            armv6l | armv7l)
              shellcheck_arch="armv6hf"
              ;;
            riscv64)
              shellcheck_arch="riscv64"
              ;;
            *)
              echo "::error::Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          archive="shellcheck-${shellcheck_release}.linux.${shellcheck_arch}.tar.gz"
          curl \
            --proto "=https" \
            --tlsv1.2 \
            -fsSL \
            --retry 3 \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${shellcheck_release}/${archive}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${shellcheck_release}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/shellcheck-${shellcheck_release}/shellcheck" --version

      - name: shellcheck
        if: always() && steps.shellcheck_files.outputs.found_files
        shell: bash
        run: |
          echo "::add-matcher::.github/matchers/shellcheck-gcc.json"
          set +e
          error=0
          shellcheck --format gcc ${{ steps.shellcheck_files.outputs.found_files }}
          error=$?
          set -e
          echo "::remove-matcher owner=shellcheck-gcc::"
          exit ${error}

      - name: YAML - find files
        id: yaml_files
        if: always()
        shell: bash
        run: |
          # space separated list of files
          FILES=.clang-format

          # empty placeholder
          found_files=""

          for FILE in ${FILES}; do
            if [ -f "$FILE" ]
            then
              found_files="$found_files $FILE"
            fi
          done

          echo "found_files=${found_files}" >> "${GITHUB_OUTPUT}"

      - name: YAML - yamllint
        id: yamllint
        if: always()
        shell: bash
        run: |
          if [ ! -f .yamllint.yml ]; then
            curl -sS https://raw.githubusercontent.com/LizardByte/.github/master/.yamllint.yml -o .yamllint.yml
          fi

          echo "::add-matcher::.github/matchers/yamllint.json"
          set +e
          error=0
          yamllint \
            --config-file .yamllint.yml \
            --format=standard \
            --strict \
            . ${{ steps.yaml_files.outputs.found_files }}
          error=$?
          set -e
          echo "::remove-matcher owner=yamllint::"
          exit ${error}
