---
name: Update Homebrew repo (called)
permissions: {}

on:
  workflow_call:
    inputs:
      gh_username:
        description: 'Username for git commits'
        required: true
        type: string
    secrets:
      GH_EMAIL:
        description: 'Email address for git commits'
        required: true
      GH_TOKEN:
        description: 'GitHub token to use for the workflow.'
        required: true

jobs:
  update-homebrew-repo:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: Homebrew
      url: https://github.com/${{ github.repository_owner }}/homebrew-homebrew/commits
    steps:
      - name: Check workflow profile
        id: check-profile
        env:
          WORKFLOW_PROFILE: homebrew
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data: values } = await github.request('GET /repos/{owner}/{repo}/properties/values', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const profiles = values.find(property => property.property_name === 'workflow_profiles')?.value ?? [];
            if (!Array.isArray(profiles) || !profiles.every(profile => typeof profile === 'string')) {
              throw new Error('Invalid workflow_profiles custom property');
            }
            const enabled = profiles.includes(process.env.WORKFLOW_PROFILE);
            core.info(`Workflow profile ${process.env.WORKFLOW_PROFILE}: ${enabled}`);
            core.setOutput('enabled', enabled);

      - name: Download release asset
        id: download
        if: steps.check-profile.outputs.enabled == 'true'
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f  # v1.13
        with:
          repository: "${{ github.repository }}"
          tag: "${{ github.event.release.tag_name }}"
          fileName: "*.rb"
          tarBall: false
          zipBall: false
          out-file-path: "release_downloads"
          extract: false

      - name: Publish Homebrew Formula
        if: >-
          steps.check-profile.outputs.enabled == 'true' &&
          fromJson(steps.download.outputs.downloaded_files)[0]
        uses: LizardByte/actions/actions/release_homebrew@master
        with:
          formula_file: ${{ fromJson(steps.download.outputs.downloaded_files)[0] }}
          git_email: ${{ secrets.GH_EMAIL }}
          git_username: ${{ inputs.gh_username }}
          publish: true
          token: ${{ secrets.GH_TOKEN }}
          validate: false
