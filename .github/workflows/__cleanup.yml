---
# Clean LizardByte package and container registries against published GitHub releases.

name: Cleanup artifacts
permissions: {}

on:
  workflow_dispatch:

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  cloudsmith:
    name: Cloudsmith
    uses: ./.github/workflows/__cleanup-cloudsmith.yml
    if: github.repository == 'LizardByte/.github'
    permissions:
      contents: read
    with:
      dry_run: true
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}

  containers:
    name: Containers
    uses: ./.github/workflows/__cleanup-containers.yml
    if: github.repository == 'LizardByte/.github'
    permissions:
      contents: read
      packages: write
    with:
      docker_hub_username: ${{ vars.DOCKER_HUB_USERNAME }}
      dry_run: true
      gh_bot_name: ${{ vars.GH_BOT_NAME }}
      max_deletions: 1000
    secrets:
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
