---
# Update changelog on release events.

name: Update changelog (called)
permissions: {}

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: 'GitHub token to use for the workflow.'
        required: true

jobs:
  organization:
    uses: ./.github/workflows/__call-organization.yml

  update-changelog:
    needs: organization
    if: needs.organization.outputs.allowed == 'true'
    name: Update Changelog
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: changelog
      url: ${{ github.event.repository.html_url }}/blob/${{ env.CHANGELOG_BRANCH }}/${{ env.CHANGELOG_FILE }}
    env:
      CHANGELOG_BRANCH: changelog
      CHANGELOG_FILE: CHANGELOG.md
    steps:
      - name: Update Changelog
        uses: LizardByte/actions/actions/release_changelog@5cffab388578559f85fa83c6f7bfff244e06600d  # v2026.1108.210022
        with:
          changelogBranch: ${{ env.CHANGELOG_BRANCH }}
          changelogFile: ${{ env.CHANGELOG_FILE }}
          token: ${{ secrets.GH_TOKEN }}
